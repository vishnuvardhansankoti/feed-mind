name: Deploy feed-mind (RSS -> Telegram)

on:
  workflow_dispatch:   # allow manual trigger from GitHub UI

# Needed for Workload Identity Federation (keyless GCP auth)
permissions:
  contents: read
  id-token: write

env:
  FUNCTION_NAME:   feedmind
  RUNTIME:         python312
  ENTRY_POINT:     feedmind
  MEMORY:          512Mi
  TIMEOUT:         300s

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      # ruff.toml is at the repo root and covers every service, so this lints
      # the whole monorepo rather than just services/feed-mind.
      - name: Run Ruff linter
        run: uvx ruff check .

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to GCP Cloud Functions
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint   # only deploy if lint passes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keyless authentication via Workload Identity Federation
      # No long-lived service account JSON key is stored anywhere.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account:            ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Generate requirements.txt for Cloud Functions
        working-directory: services/feed-mind
        run: uv pip compile pyproject.toml -o requirements.txt

      - name: Deploy Cloud Function (Gen 2)
        # --source is the service directory, not the repo root; gcloud also
        # reads .gcloudignore from there.
        working-directory: services/feed-mind
        run: |
          gcloud functions deploy ${{ env.FUNCTION_NAME }} \
            --gen2 \
            --runtime=${{ env.RUNTIME }} \
            --region=${{ secrets.GCP_REGION }} \
            --source=. \
            --entry-point=${{ env.ENTRY_POINT }} \
            --trigger-http \
            --no-allow-unauthenticated \
            --memory=${{ env.MEMORY }} \
            --timeout=${{ env.TIMEOUT }} \
            --service-account=${{ secrets.FUNCTION_SERVICE_ACCOUNT }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Print deployed function URL
        run: |
          URL=$(gcloud functions describe ${{ env.FUNCTION_NAME }} \
            --region=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(serviceConfig.uri)")
          echo "✅ Deployed: $URL"
          echo "FUNCTION_URL=$URL" >> $GITHUB_ENV

      - name: Update Cloud Scheduler job URI
        # Keep the Scheduler pointing at the latest function URL after each deploy
        run: |
          gcloud scheduler jobs update http feedmind-daily-trigger \
            --location=${{ secrets.GCP_REGION }} \
            --uri=${{ env.FUNCTION_URL }} \
            --oidc-token-audience=${{ env.FUNCTION_URL }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            2>/dev/null || echo "Scheduler job not found — skipping update (run deploy.sh once first)"

      - name: Summary
        run: |
          echo "### 🚀 FeedMind Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Function** | \`${{ env.FUNCTION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ secrets.GCP_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Runtime** | \`${{ env.RUNTIME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.FUNCTION_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

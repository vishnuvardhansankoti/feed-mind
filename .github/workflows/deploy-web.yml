name: Deploy web (Svelte PWA -> Firebase Hosting)

# Manual only — never triggers automatically. Run it from the Actions tab
# ("Run workflow"). Builds the Svelte SPA against Firestore and deploys it to
# Firebase Hosting.
on:
  workflow_dispatch:
    inputs:
      also_deploy_rules:
        description: "Also deploy Firestore rules + indexes"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      # VITE_* values are inlined at build time, and .env.prod is gitignored, so
      # materialize it here from repo vars/secrets.
      #
      # It MUST be .env.prod, not .env.production: `npm run build` is
      # `vite build --mode prod`, and Vite loads .env.<mode> — with mode "prod"
      # it never reads .env.production. Writing the wrong name left the build
      # with no VITE_* values at all and shipped a bundle with empty Firebase
      # config.
      #
      # VITE_FIRESTORE_DATABASE must match the pipeline's FIRESTORE_DATABASE.
      - name: Write .env.prod
        run: |
          cat > .env.prod <<EOF
          VITE_DATA_SOURCE=firestore
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE=${{ vars.VITE_FIRESTORE_DATABASE }}
          EOF

      - run: npm run build

      # Authenticate to GCP/Firebase. Reuses the same GCP_SA_KEY secret as the
      # pipeline workflow; the SA needs the Firebase Hosting Admin role.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        working-directory: .
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting${{ inputs.also_deploy_rules && ',firestore' || '' }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

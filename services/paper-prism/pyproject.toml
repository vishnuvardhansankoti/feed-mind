[project]
name = "paper-prism"
version = "1.0.0"
description = "Weekly personalized arXiv digest — arXiv → ONNX embed → cosine top-k → Gemini → Firestore"
# The Cloud Run image is python:3.11-slim (see Dockerfile). Keep these in step.
requires-python = ">=3.11"
dependencies = [
    # --- core pipeline (deliberately no torch; see CLAUDE.md) ---
    "requests>=2.31",
    "feedparser>=6.0",          # arXiv Atom XML parsing
    "numpy>=1.24",
    "onnxruntime>=1.17",        # MiniLM inference, no torch
    "tokenizers>=0.15",         # HF fast tokenizer, no torch
    "huggingface_hub>=0.20",    # one-time model/tokenizer download
    "python-dotenv>=1.0",
    # --- required in the deployed image (SINK=firestore in prod) ---
    "google-cloud-firestore>=2.13",
    # --- announcing a finished run to downstream consumers (events.py) ---
    "google-cloud-pubsub>=2.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Tests import the package straight from src/ (no install step needed).
pythonpath = ["src"]
testpaths = ["tests"]

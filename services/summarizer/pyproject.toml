[project]
name = "feedmind-summarizer"
version = "1.0.0"
description = "Scrape, LLM-summarize and narrate FeedMind articles and paper-prism papers"
# Deployed as a Cloud Run container (see deploy/00-config.sh, Dockerfile) —
# functions-framework runs standalone as the HTTP server inside it, serving
# main.py::on_content_ready with --signature-type=cloud_event, so the Pub/Sub
# push decoding in main.py is unchanged from the Cloud Functions era.
requires-python = ">=3.11"
dependencies = [
    "functions-framework==3.*",

    "google-cloud-firestore==2.28.1",
    "google-cloud-storage==3.13.1",
    "google-cloud-texttospeech==2.*",
    # Needed by main.py::republish to continue a batch that stopped early on
    # MAX_RUNTIME — was missing entirely, so every republish attempt failed
    # with an ImportError, caught and logged rather than raised. A batch that
    # didn't finish in one invocation just silently stopped forever. See
    # services/summarizer/CLAUDE.md's "RSS_FEED excludes..." incident note.
    "google-cloud-pubsub==2.40.0",

    # FEEDMIND_TTS=local's waveform synthesizer — replaces espeak-ng (see the
    # comment below this dependency list for why it's not just a version
    # bump). Installs the `piper` console script the Dockerfile's baked-in
    # voice model is invoked through as a subprocess; see webscraper/speech.py.
    "piper-tts>=1.2,<2",

    "spacy==3.8.15",
    # The spaCy pipeline is not on PyPI, so it comes from its release URL. It
    # must match the spacy version above — 3.8.0 targets spaCy 3.8.x.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",

    # Web Push sender (feedmind_push.py). Absent at runtime is survivable:
    # notify() logs and returns rather than failing the batch.
    "pywebpush==2.0.3",
]

# Deliberately absent: pyttsx3. FEEDMIND_TTS=local (see docs/feed-mind/
# tts-switch.md) does not need it on the deployed container — the Cloud Run
# path invokes `piper` directly as a subprocess (webscraper/speech.py::
# synthesize_wav), because pyttsx3's Linux driver is not safe to call off the
# process's main thread, and functions-framework's CloudEvent dispatch always
# runs the handler on a spawned thread (confirmed by instrumenting a real
# deployment — pyttsx3 silently produced no output there, no exception).
# `ffmpeg` is still installed via apt in the Dockerfile, for the WAV->MP3
# transcode; Piper's voice model is baked into the image separately (also in
# the Dockerfile), not installed via apt or this dependency list.
#
# Piper replaced espeak-ng here (2026-09) as the waveform synthesizer for
# meaningfully better voice quality at the same zero marginal cost — Cloud TTS
# is still the only backend that costs anything, and only past its free tier.
# piper-tts 1.8.0's only dependencies are onnxruntime and pathvalidate — no
# separate piper-phonemize package; its phonemizer (still eSpeak-NG-based
# under the hood) is bundled directly into its own ~34MB wheel.
#
# pyttsx3 remains the CLI's own local backend on macOS/Windows (feedmind_audio.py
# only calls webscraper.speech.speak() there, never on Linux), where it has no
# thread-affinity problem — install it by hand for that:
#     uv pip install --python .venv/bin/python pyttsx3

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

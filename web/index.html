<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>feed-mind · Daily Tech News and Weekly Research Papers Digest</title>
    <meta
      name="description"
      content="A personalized digest of daily tech news and weekly arXiv research — ranked to your interests and summarized by AI, across academia, industry, cloud &amp; open source."

    <link rel="canonical" href="https://feed-mind.web.app/" />
    <meta name="theme-color" content="#0b0d12" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, …) -->

    <meta property="og:site_name" content="feed-mind" />
    <meta property="og:title" content="feed-mind · Daily Tech News and Weekly Research Papers Digest" />
    <meta
      property="og:description"
      content="A personalized digest of daily tech news and weekly arXiv research — ranked to your interests and summarized by AI, across academia, industry, cloud & open source."
    />
    <meta property="og:url" content="https://feed-mind.web.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="feed-mind · Daily Tech News and Weekly Research Papers Digest" />

      name="twitter:description"
      content="A personalized digest of daily tech news and weekly arXiv research — ranked to your interests and summarized by AI."
    />
    <meta name="twitter:image" content="https://feed-mind.web.app/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "feed-mind",
        "url": "https://feed-mind.web.app/",
        "description": "A personalized digest of daily tech news and weekly arXiv research, ranked to your interests and summarized by AI.",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

</html>

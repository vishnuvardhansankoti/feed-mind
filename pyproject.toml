[project]
name = "feedmind"
version = "1.0.0"
description = "Serverless RSS summarization and notification system"
requires-python = ">=3.12"
dependencies = [
    "feedparser==6.0.11",
    "google-cloud-firestore==2.19.0",
    "google-cloud-secret-manager==2.20.0",
    "google-generativeai==0.8.3",
    "httpx==0.27.2",
    "functions-framework==3.8.1",
    "sumy>=0.11.0",
    "nltk>=3.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
